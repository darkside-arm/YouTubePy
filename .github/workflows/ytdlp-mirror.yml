name: Publicar release (yt-dlp aarch64 + codigo)

# Se lanza A MANO desde la pestana Actions. No hay cron: la app actualiza
# yt-dlp sola contra el repo oficial en cada arranque, asi que estos releases
# solo sirven para INSTALAR, no para mantener actualizado nada.
#
# Genera un release con:
#   - YouTubePy-<ver>.zip   codigo completo + el zipapp de yt-dlp (~3 MB) ya
#                           puesto en youtube_py/yt-dlp.zip (verificado por
#                           SHA-256), listo para descomprimir en /roms/ports
#   - mpv-aarch64.zip       dependencia OPCIONAL; la app se la descarga sola
#                           si la consola no trae reproductor
# Ademas mantiene el tag movil "ytdlp-latest" con los mismos assets, para
# tener una URL de descarga estable (es la que usa la app para bajar mpv).
#
# Lanzalo cuando cambies el codigo del port. Si no hay version nueva de
# yt-dlp y quieres reempaquetar igualmente, marca la casilla "force".

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerar el release aunque no haya version nueva de yt-dlp"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolver ultima version de yt-dlp
        id: up
        run: |
          ver=$(curl -fsSL --retry 5 --retry-delay 5 \
                https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest \
                | jq -r .tag_name)
          [ -n "$ver" ] && [ "$ver" != "null" ] || { echo "no version"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Upstream yt-dlp: $ver"

      - name: Comprobar si ya publicamos esta version
        id: have
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "ytdlp-${{ steps.up.outputs.version }}" \
               --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Ya existe el release, nada que hacer."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar y verificar yt-dlp (zipapp)
        if: steps.have.outputs.skip == 'false'
        env:
          V: ${{ steps.up.outputs.version }}
        run: |
          # Se empaqueta el ZIPAPP (python puro, ~3 MB), no el binario
          # PyInstaller de 36 MB: la consola ya tiene Python 3, el zipapp se
          # importa DENTRO del proceso de la app y evita pagar ~6 s de
          # arranque de interprete en cada llamada a yt-dlp.
          base="https://github.com/yt-dlp/yt-dlp/releases/download/$V"
          curl -fsSL --retry 5 --retry-delay 5 -o yt-dlp "$base/yt-dlp"
          curl -fsSL --retry 5 --retry-delay 5 -o SHA2-256SUMS \
               "$base/SHA2-256SUMS"
          grep " yt-dlp$" SHA2-256SUMS > expected.sha256
          sha256sum -c expected.sha256
          [ "$(stat -c%s yt-dlp)" -ge 1000000 ] \
            || { echo "zipapp demasiado pequeno"; exit 1; }
          # Un zipapp es un ZIP con cabecera shebang: debe traer __main__.py
          unzip -l yt-dlp | grep -q '__main__.py'
          python3 -c "import sys; sys.path.insert(0,'yt-dlp'); import yt_dlp; \
                      print('zipapp ok:', yt_dlp.version.__version__)"

      - name: Construir dependencia mpv-aarch64.zip
        if: steps.have.outputs.skip == 'false'
        run: |
          # Paquete de dependencia OPCIONAL, aparte del zip del port. La app
          # lo descarga sola cuando no encuentra mpv en el sistema, y lo
          # extrae en youtube_py/{bin,lib}. Nada se instala en el sistema.
          #
          # Incluye libgbm de mesa porque DarkOS/ArkOS sustituyen libgbm.so.1
          # por un symlink a libMali.so, que no exporta
          # gbm_surface_create_with_modifiers y hace que mpv aborte al arrancar.
          set -e
          rm -rf debs mpvroot mpvpkg && mkdir -p debs mpvroot mpvpkg/bin mpvpkg/lib
          # Las rutas se resuelven contra el indice de TRIXIE, no listando el
          # pool: el pool mezcla todas las suites y devolveria mpv de sid,
          # que enlaza contra libavcodec mas nuevas de las que trae la consola.
          curl -fsSL --retry 5 --retry-delay 5 -o Packages.gz \
            http://deb.debian.org/debian/dists/trixie/main/binary-arm64/Packages.gz
          for p in mpv libmujs3 libsixel1 libva-wayland2 libxpresent1 libgbm1; do
            f=$(zcat Packages.gz | awk -v pkg="$p" '
                  $1=="Package:" {cur=$2}
                  $1=="Filename:" && cur==pkg {print $2; exit}')
            [ -n "$f" ] || { echo "no se resolvio $p en trixie"; exit 1; }
            echo "  $f"
            curl -fsSL --retry 5 --retry-delay 5 \
              -o "debs/$(basename "$f")" "http://deb.debian.org/debian/$f"
          done
          for d in debs/*.deb; do dpkg-deb -x "$d" mpvroot; done
          cp mpvroot/usr/bin/mpv mpvpkg/bin/mpv
          chmod 755 mpvpkg/bin/mpv
          # /roms suele ser exFAT y no admite symlinks: se copian los ficheros
          # reales con el nombre del SONAME.
          for so in libgbm.so.1 libmujs.so.3 libsixel.so.1 \
                    libva-wayland.so.2 libXpresent.so.1; do
            real=$(find mpvroot -name "$so*" -type f | head -1)
            [ -n "$real" ] || { echo "falta $so"; exit 1; }
            cp "$real" "mpvpkg/lib/$so"
          done
          nm -D mpvpkg/lib/libgbm.so.1 | grep -q gbm_surface_create_with_modifiers \
            || { echo "la libgbm descargada no trae el simbolo"; exit 1; }
          file mpvpkg/bin/mpv | grep -qi aarch64
          (cd mpvpkg && zip -rq ../mpv-aarch64.zip .)
          ls -l mpv-aarch64.zip && unzip -l mpv-aarch64.zip

      - name: Empaquetar codigo + yt-dlp
        if: steps.have.outputs.skip == 'false'
        id: pack
        env:
          V: ${{ steps.up.outputs.version }}
        run: |
          zipname="YouTubePy-$V.zip"
          rm -rf pkg && mkdir -p pkg/youtube_py
          # Codigo de la app tal cual va en /roms/ports/youtube_py
          cp -r youtube_py/. pkg/youtube_py/
          cp YouTubePy.sh pkg/
          # yt-dlp ya listo dentro del paquete: no hay descarga en el device
          cp yt-dlp pkg/youtube_py/yt-dlp.zip
          chmod 755 pkg/youtube_py/yt-dlp.zip pkg/YouTubePy.sh
          # Limpieza de restos que no deben viajar
          find pkg -name '__pycache__' -type d -prune -exec rm -rf {} +
          find pkg -name '*.pyc' -delete
          rm -rf pkg/youtube_py/bin pkg/youtube_py/lib
          rm -f pkg/youtube_py/log.txt pkg/youtube_py/cookies.txt \
                pkg/youtube_py/yt-dlp.real pkg/youtube_py/yt-dlp.real.part \
                pkg/youtube_py/yt-dlp.zip.part
          (cd pkg && zip -rq "../$zipname" .)
          echo "zip=$zipname" >> "$GITHUB_OUTPUT"
          ls -l "$zipname"
          unzip -l "$zipname" | tail -n 5

      - name: Publicar release ytdlp-<version>
        if: steps.have.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.up.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip }}
        run: |
          gh release delete "ytdlp-$V" --repo "${{ github.repository }}" \
            --cleanup-tag --yes 2>/dev/null || true
          gh release create "ytdlp-$V" \
            --repo "${{ github.repository }}" \
            --title "YouTubePy - yt-dlp $V (linux aarch64)" \
            --notes "Build con yt-dlp **$V** para ARM64 (R36S/R36T/ArkOS).

          **Instalacion:** descomprimir \`$ZIP\` dentro de \`/roms/ports\`
          (deja \`YouTubePy.sh\` y la carpeta \`youtube_py/\` con yt-dlp ya
          incluido en \`youtube_py/yt-dlp.zip\`, verificado por SHA-256).

          Se empaqueta el **zipapp** de yt-dlp (~3 MB) en vez del binario
          PyInstaller (~36 MB): la app lo importa en su propio proceso y se
          ahorra ~6 s de arranque de interprete en cada video.

          Upstream: https://github.com/yt-dlp/yt-dlp/releases/tag/$V" \
            "$ZIP" mpv-aarch64.zip

      - name: Actualizar tag movil ytdlp-latest
        if: steps.have.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.up.outputs.version }}
          ZIP: ${{ steps.pack.outputs.zip }}
        run: |
          cp "$ZIP" YouTubePy-latest.zip
          gh release delete ytdlp-latest --repo "${{ github.repository }}" \
            --cleanup-tag --yes 2>/dev/null || true
          gh release create ytdlp-latest \
            --repo "${{ github.repository }}" \
            --title "YouTubePy - ultima build (yt-dlp $V)" \
            --notes "Apunta siempre a la ultima build. yt-dlp actual: **$V**.

          Descarga \`YouTubePy-latest.zip\` y descomprimelo en \`/roms/ports\`;
          incluye el codigo y el zipapp de yt-dlp ya verificado.

          \`mpv-aarch64.zip\` es una **dependencia opcional**: la app se la
          descarga sola desde este tag cuando la consola no trae mpv. No hay
          que instalarla a mano ni tocar el sistema." \
            YouTubePy-latest.zip mpv-aarch64.zip
